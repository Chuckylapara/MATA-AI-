# Publishes the frontend (including NEXUS at /nexus/) to GitHub Pages on every push to main,
# so it can be opened from any phone or PC without building locally.
# The built site is pushed to the `gh-pages` branch, which GitHub Pages serves.
# Optional: Settings → Secrets and variables → Actions → Variables → NEXUS_API_URL = your backend URL.
name: Publish NEXUS (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:nexus
      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXUS_API_URL || 'https://mata-ai-backend.onrender.com' }}
      - name: Push to gh-pages
        working-directory: frontend/out
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
